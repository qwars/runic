[package]
name = "runic"
version = "2.0.0"
edition = "2024"

[dependencies]
async-channel = "2"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
futures-lite = "2"
glib = "0.22"
gtk4 = { version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = "0.8"
javascriptcore6 = "0.6"
libc = "0.2"
log = "0.4"
parking_lot = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
signal-hook = "0.4.5"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
webkit6 = "0.6"
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = 0