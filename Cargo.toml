[package]
name = "runic"
version = "1.3.0"
edition = "2024"
description = "Lightweight HTML/CSS/JS desktop widget engine for Linux (Wayland)"
authors = ["Alexandr Selunin <aka.qwars@gmail.com>"]
license = "MIT"
repository = "https://github.com/qwars/runic"
homepage = "https://github.com/qwars/runic"
readme = "README.md"
keywords = ["widget", "desktop", "wayland", "gtk", "conky"]
categories = ["gui", "command-line-utilities"]
rust-version = "1.85"

[dependencies]
gtk = "0.18"
glib = "0.18"
gio = "0.18"
webkit2gtk = { version = "2.0.2", default-features = false, features = ["v2_22"] }
gtk-layer-shell = "0.7"
async-channel = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6.7", features = ["derive"] }
inotify = "0.11.5"
libc = "0.2.190"

[profile.release]
strip = true
lto = true
