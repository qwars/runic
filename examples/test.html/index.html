<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runic Test Widget</title>
    <style>
        /* Прозрачный фон для всего документа */
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
        }

        /* Стиль самого виджета */
        .widget {
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h2 {
            margin-top: 0;
            color: #4fc3f7;
            font-size: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .section {
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            color: #aaa;
            font-size: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }

        button {
            background: #4fc3f7;
            color: #1a1a1a;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #29b6f6;
        }

        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }

        .output {
            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
            color: #81c784;
        }

        .output.error {
            color: #e57373;
        }

        .output.info {
            color: #fff176;
        }
    </style>
</head>
<body>
    <div class="widget">
        <h2>🛠️ Runic IPC Test</h2>

        <!-- READ -->
        <div class="section">
            <h3>📖 Read File</h3>
            <label>Path:</label>
            <input type="text" id="read-path" value="/etc/os-release">
            <button onclick="testRead()">Read</button>
            <div id="read-output" class="output">Ожидание...</div>
        </div>

        <!-- WRITE -->
        <div class="section">
            <h3>✍️ Write File</h3>
            <label>Path:</label>
            <input type="text" id="write-path" value="/tmp/runic_test.log">
            <label>Data:</label>
            <input type="text" id="write-data" value="Hello from Runic!">
            <button onclick="testWrite()">Append</button>
            <div id="write-output" class="output">Ожидание...</div>
        </div>

        <!-- EXEC -->
        <div class="section">
            <h3>⚡ Exec Command</h3>
            <label>Command:</label>
            <input type="text" id="exec-cmd" value="uname -a">
            <button onclick="testExec()">Execute</button>
            <div id="exec-output" class="output">Ожидание...</div>
        </div>

        <!-- STREAM -->
        <div class="section">
            <h3>🌊 Stream Command</h3>
            <label>Command:</label>
            <input type="text" id="stream-cmd" value="for i in 1 2 3 4 5; do echo &quot;Tick $i&quot;; sleep 1; done">
            <button id="stream-btn" onclick="testStream()">Start Stream</button>
            <div id="stream-output" class="output">Ожидание...</div>
        </div>
    </div>
    <script>
        // Глобальный обработчик ответов от Rust
        window.onRunicResponse = function(response) {
            try {
                const outputId = response.action + '-output';
                const outputEl = document.getElementById(outputId);
                if (!outputEl) return;

                if (response.status === 'error') {
                    outputEl.className = 'output error';
                    outputEl.textContent = `❌ Ошибка: ${response.message}`;
                    console.error(`[Runic Error] ${response.action}: ${response.message}`); // Логируем только реальные ошибки
                } else if (response.status === 'stream_data') {
                    outputEl.className = 'output';
                    outputEl.textContent += response.data + '\n';
                    outputEl.scrollTop = outputEl.scrollHeight;
                } else {
                    outputEl.className = 'output';
                    outputEl.textContent = response.data || response.message || 'OK';
                }
            } catch (e) {
                console.error('[Runic] Ошибка обработки ответа:', e, response);
            }
        };

        function sendToRust(action, payload) {
            const msg = JSON.stringify({ action, payload });
            if (window.ipc && typeof window.ipc.postMessage === 'function') {
                window.ipc.postMessage(msg);
            } else {
                console.error('[Runic] Не удалось отправить: IPC недоступен');
            }
        }

        function testRead() {
            document.getElementById('read-output').textContent = 'Загрузка...';
            document.getElementById('read-output').className = 'output info';
            sendToRust('read', { path: document.getElementById('read-path').value });
        }

        function testWrite() {
            document.getElementById('write-output').textContent = 'Запись...';
            document.getElementById('write-output').className = 'output info';
            sendToRust('write', {
                path: document.getElementById('write-path').value,
                data: document.getElementById('write-data').value + '\n'
            });
        }

        function testExec() {
            document.getElementById('exec-output').textContent = 'Выполнение...';
            document.getElementById('exec-output').className = 'output info';
            sendToRust('exec', { command: document.getElementById('exec-cmd').value });
        }

        function testStream() {
            const outputEl = document.getElementById('stream-output');
            const btn = document.getElementById('stream-btn');
            outputEl.textContent = 'Запуск потока...\n';
            outputEl.className = 'output info';
            btn.disabled = true;
            btn.textContent = 'Running...';
            sendToRust('stream', { target: document.getElementById('stream-cmd').value });

            setTimeout(() => {
                btn.disabled = false;
                btn.textContent = 'Start Stream';
                outputEl.className = 'output';
                outputEl.textContent += '\n✅ Поток завершен (таймаут)';
            }, 8000);
        }
    </script>
</body>
</html>
